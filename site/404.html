<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<title>Page not found | Geosurv</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #0F1116;
    color: #E8EBF2;
    font: 400 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .box {
    background: #161922;
    border: 1px solid #262B38;
    border-radius: 12px;
    padding: 40px 30px;
    max-width: 460px;
    margin: 20px;
    text-align: center;
  }
  /* The logo artwork is dark navy, so it needs a light chip on a dark page. */
  .logomark { background: #fff; border-radius: 7px; padding: 6px 10px; display: inline-flex; margin-bottom: 24px; }
  img { height: 22px; display: block; }
  .mark {
    width: 40px; height: 40px; border-radius: 11px;
    background: rgba(240, 85, 64, .14); color: #F05540;
    display: grid; place-items: center;
    margin: 0 auto 16px;
    font-size: 19px; font-weight: 700;
  }
  h1 { margin: 0 0 8px; font-size: 18px; font-weight: 620; letter-spacing: -.01em; }
  p { margin: 0; color: #98A1B3; font-size: 14px; }
</style>
</head>
<body>
  <div class="box">
    <span class="logomark"><img src="/requests/geosurv-logo.png" alt="Geosurv"></span>
    <div class="mark">!</div>
    <h1>This link is not recognised</h1>
    <p>Open your survey request tracker using the full link in your Geosurv status email, or ask your Geosurv coordinator to resend it.</p>
  </div>
</body>
</html>
