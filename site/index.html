<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Survey requests | Geosurv</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23E8402F'/><path d='M9 20.5 15 11l3.4 5.4L20.6 13 24 20.5z' fill='%23fff'/></svg>">
<style>
  :root {
    --red: #E8402F;
    --red-dark: #C9331F;
    --red-tint: #FDEDEB;
    --navy: #1E4288;
    --ink: #16181C;
    --muted: #667085;
    --faint: #98A2B3;
    --line: #E7E9EE;
    --line-soft: #F1F2F5;
    --bg: #FAFBFC;
    --card: #FFFFFF;
    --green: #12A150;
    --green-tint: #E7F7EE;
    --amber: #B4690E;
    --amber-tint: #FDF3E3;
    --blue: #1B6FCC;
    --blue-tint: #EAF2FD;
    --violet: #7A3FBF;
    --violet-tint: #F3ECFC;
    --slate-tint: #F2F4F7;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 1px 3px rgba(16, 24, 40, .04);
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 400 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-feature-settings: "cv11", "ss01";
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 880px; margin: 0 auto; padding: 0 20px; }

  /* ---------- header ---------- */

  header {
    background: var(--card);
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    min-height: 62px;
    padding: 12px 0;
  }

  .logo { height: 26px; width: auto; display: block; }

  .stamp {
    text-align: right;
    font-size: 12px;
    line-height: 1.35;
    color: var(--faint);
    white-space: nowrap;
  }
  .stamp b { display: block; color: var(--muted); font-weight: 500; }

  /* ---------- title block ---------- */

  .intro { padding: 34px 0 22px; }
  .eyebrow {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--red);
    margin: 0 0 8px;
  }
  h1 { margin: 0; font-size: 27px; line-height: 1.2; font-weight: 650; letter-spacing: -.02em; }
  .sub { margin: 8px 0 0; color: var(--muted); font-size: 14.5px; }

  .tallies { display: flex; flex-wrap: wrap; gap: 10px; margin: 22px 0 0; }
  .tally {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 11px 15px;
    min-width: 104px;
    box-shadow: var(--shadow);
  }
  .tally .n { font-size: 21px; font-weight: 640; letter-spacing: -.02em; line-height: 1.1; }
  .tally .k { font-size: 11.5px; color: var(--muted); margin-top: 3px; letter-spacing: .01em; }
  .tally.is-live .n { color: var(--red); }
  .tally.is-done .n { color: var(--green); }

  /* ---------- sections ---------- */

  section { margin: 30px 0 0; }
  .shead {
    display: flex;
    align-items: baseline;
    gap: 9px;
    margin: 0 0 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--line);
  }
  .shead h2 { margin: 0; font-size: 13px; font-weight: 620; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  .shead .c { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }

  /* ---------- cards ---------- */

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 17px 18px 15px;
    margin-bottom: 11px;
    box-shadow: var(--shadow);
  }
  .card.done { background: #FDFDFE; }

  .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
  .title { margin: 0; font-size: 15.5px; font-weight: 600; line-height: 1.4; letter-spacing: -.005em; }

  .pill {
    flex: 0 0 auto;
    font-size: 11.5px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 999px;
    white-space: nowrap;
    letter-spacing: .01em;
  }
  .pill.submitted   { background: var(--slate-tint);  color: #475467; }
  .pill.review      { background: var(--amber-tint);  color: var(--amber); }
  .pill.scheduled   { background: var(--blue-tint);   color: var(--blue); }
  .pill.progress    { background: var(--violet-tint); color: var(--violet); }
  .pill.delivered   { background: var(--green-tint);  color: var(--green); }
  .pill.closed      { background: var(--slate-tint);  color: #475467; }

  .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 10px;
    margin: 7px 0 0;
    font-size: 12.5px;
    color: var(--faint);
  }
  .meta span + span::before { content: "·"; margin-right: 10px; color: var(--line); }
  .meta code {
    font: inherit;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
  }

  /* ---------- pipeline ---------- */

  .pipe { margin: 16px 0 2px; }
  .track { display: flex; align-items: center; }
  .node { position: relative; display: flex; align-items: center; flex: 0 0 auto; }
  .dot {
    width: 11px; height: 11px; border-radius: 50%;
    background: var(--card);
    border: 2px solid var(--line);
    flex: 0 0 auto;
    transition: none;
  }
  .seg { height: 2px; background: var(--line); flex: 1 1 auto; min-width: 8px; }

  .node.past .dot { background: var(--red); border-color: var(--red); }
  .seg.past { background: var(--red); }
  .node.at .dot {
    background: var(--card);
    border-color: var(--red);
    box-shadow: 0 0 0 3.5px var(--red-tint);
  }
  .card.done .node.past .dot { background: var(--green); border-color: var(--green); }
  .card.done .seg.past { background: var(--green); }
  .card.done .node.at .dot { border-color: var(--green); box-shadow: 0 0 0 3.5px var(--green-tint); }

  .labels { display: flex; margin: 8px 0 0; }
  .labels span {
    font-size: 11px;
    color: var(--faint);
    flex: 1 1 0;
    text-align: center;
    letter-spacing: .005em;
  }
  .labels span:first-child { text-align: left; }
  .labels span:last-child { text-align: right; }
  .labels span.on { color: var(--ink); font-weight: 600; }
  .labels span.was { color: var(--muted); }

  .stagetext { display: none; margin: 9px 0 0; font-size: 12px; color: var(--muted); }
  .stagetext b { color: var(--ink); font-weight: 600; }

  /* ---------- dates ---------- */

  .dates {
    display: flex;
    flex-wrap: wrap;
    gap: 0 26px;
    margin: 16px 0 0;
    padding-top: 13px;
    border-top: 1px solid var(--line-soft);
  }
  .dates div { min-width: 92px; }
  .dates dt { font-size: 11px; color: var(--faint); letter-spacing: .01em; }
  .dates dd {
    margin: 2px 0 0;
    font-size: 13.5px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  .dates dd.none { color: var(--faint); font-weight: 400; }
  .dates dd.late { color: var(--red); }

  /* ---------- actions ---------- */

  .acts { display: flex; flex-wrap: wrap; gap: 8px; margin: 15px 0 0; }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font: inherit;
    font-size: 13px;
    font-weight: 550;
    padding: 7px 13px;
    border-radius: 8px;
    border: 1px solid transparent;
    text-decoration: none;
    cursor: pointer;
    transition: background .12s ease, border-color .12s ease;
  }
  .btn.primary { background: var(--red); color: #fff; }
  .btn.primary:hover { background: var(--red-dark); }
  .btn.ghost { background: var(--card); border-color: var(--line); color: var(--muted); }
  .btn.ghost:hover { border-color: #D0D5DD; color: var(--ink); }
  .btn svg { width: 13px; height: 13px; flex: 0 0 auto; }
  .btn:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }

  /* ---------- states ---------- */

  .state {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 42px 26px;
    text-align: center;
    box-shadow: var(--shadow);
    margin: 34px 0;
  }
  .state h2 { margin: 0 0 8px; font-size: 18px; font-weight: 620; letter-spacing: -.01em; }
  .state p { margin: 0 auto; max-width: 44ch; color: var(--muted); font-size: 14px; }
  .state .mark {
    width: 40px; height: 40px; border-radius: 11px;
    background: var(--red-tint); color: var(--red);
    display: grid; place-items: center;
    margin: 0 auto 16px;
    font-size: 19px; font-weight: 700;
  }
  .state.ok .mark { background: var(--green-tint); color: var(--green); }

  footer {
    margin: 40px 0 0;
    padding: 22px 0 34px;
    border-top: 1px solid var(--line);
    color: var(--faint);
    font-size: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 4px 12px;
    justify-content: space-between;
  }
  footer a { color: var(--muted); }

  .sr {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  @media (max-width: 620px) {
    .labels { display: none; }
    .stagetext { display: block; }
    h1 { font-size: 23px; }
    .intro { padding: 26px 0 18px; }
    .top { flex-direction: column-reverse; align-items: flex-start; gap: 9px; }
    .dates { gap: 12px 22px; }
    .tally { flex: 1 1 auto; min-width: 88px; }
  }

  @media print {
    header { position: static; }
    .acts, footer { display: none; }
    body { background: #fff; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <img class="logo" src="geosurv-logo.png" alt="Geosurv">
    <div class="stamp" id="stamp"></div>
  </div>
</header>

<main class="wrap" id="main">
  <div class="state" id="loading">
    <div class="mark">&middot;&middot;&middot;</div>
    <h2>Loading your requests</h2>
    <p>One moment.</p>
  </div>
</main>

<footer class="wrap">
  <span>Geosurv survey request tracker</span>
  <span>Read only view. Contact your Geosurv coordinator for anything not shown here.</span>
</footer>

<script>
(function () {
  'use strict';

  // Public WorkForm used by the "Request a change" button. The Request ID is
  // passed as the "rid" URL parameter and pre-fills the matching question.
  // Full form URL rather than the wkf.ms short link, so the rid parameter
  // survives without depending on the shortener preserving the query string.
  var CHANGE_FORM_URL = 'https://forms.monday.com/forms/1da50b5af2a2517c7d2db49ad40289bd?r=apse2';

  var STAGES = ['Submitted', 'Under review', 'Scheduled', 'In progress', 'Delivered'];
  var PILL = {
    'Submitted': 'submitted',
    'Under review': 'review',
    'Scheduled': 'scheduled',
    'In progress': 'progress',
    'Delivered': 'delivered',
    'Closed': 'closed'
  };

  var main = document.getElementById('main');
  var stamp = document.getElementById('stamp');

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function state(cls, mark, heading, body) {
    main.replaceChildren();
    var box = el('div', 'state' + (cls ? ' ' + cls : ''));
    box.appendChild(el('div', 'mark', mark));
    box.appendChild(el('h2', null, heading));
    box.appendChild(el('p', null, body));
    main.appendChild(box);
  }

  // ---------- dates ----------

  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  function fmtDate(iso) {
    if (!iso) return null;
    var p = String(iso).split('-');
    if (p.length !== 3) return null;
    var d = Number(p[2]), m = Number(p[1]), y = Number(p[0]);
    if (!d || !m || !y) return null;
    return d + ' ' + MONTHS[m - 1] + ' ' + y;
  }

  function todayISO() {
    // Sydney, so "overdue" matches the client's own calendar day.
    var f = new Intl.DateTimeFormat('en-CA', {
      timeZone: 'Australia/Sydney', year: 'numeric', month: '2-digit', day: '2-digit'
    });
    return f.format(new Date());
  }

  function fmtStamp(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return '';
    return new Intl.DateTimeFormat('en-AU', {
      timeZone: 'Australia/Sydney',
      day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit'
    }).format(d);
  }

  // ---------- pipeline ----------

  function pipeline(req) {
    var wrap = el('div', 'pipe');
    var at = STAGES.indexOf(req.status);
    var complete = req.status === 'Delivered' || req.status === 'Closed';
    if (complete) at = STAGES.length - 1;
    if (at < 0) at = 0;

    var track = el('div', 'track');
    for (var i = 0; i < STAGES.length; i++) {
      if (i > 0) {
        var seg = el('div', 'seg' + (i <= at ? ' past' : ''));
        track.appendChild(seg);
      }
      var cls = 'node';
      if (i < at || (complete && i === at)) cls += ' past';
      else if (i === at) cls += ' at';
      var node = el('div', cls);
      node.appendChild(el('div', 'dot'));
      track.appendChild(node);
    }
    wrap.appendChild(track);

    var labels = el('div', 'labels');
    for (var j = 0; j < STAGES.length; j++) {
      var c = j === at ? 'on' : (j < at ? 'was' : '');
      labels.appendChild(el('span', c, STAGES[j]));
    }
    wrap.appendChild(labels);

    var line = el('p', 'stagetext');
    line.appendChild(document.createTextNode('Stage ' + (at + 1) + ' of ' + STAGES.length + ': '));
    line.appendChild(el('b', null, req.status === 'Closed' ? 'Delivered' : (req.status || 'Submitted')));
    wrap.appendChild(line);

    return wrap;
  }

  // ---------- card ----------

  function dateBlock(label, iso, overdue) {
    var d = el('div');
    d.appendChild(el('dt', null, label));
    var v = fmtDate(iso);
    d.appendChild(el('dd', v ? (overdue ? 'late' : null) : 'none', v || 'Not set'));
    return d;
  }

  function icon(path) {
    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 16 16');
    svg.setAttribute('fill', 'none');
    svg.setAttribute('stroke', 'currentColor');
    svg.setAttribute('stroke-width', '1.7');
    svg.setAttribute('stroke-linecap', 'round');
    svg.setAttribute('stroke-linejoin', 'round');
    svg.setAttribute('aria-hidden', 'true');
    var p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', path);
    svg.appendChild(p);
    return svg;
  }

  function card(req, today) {
    var done = req.status === 'Delivered' || req.status === 'Closed';
    var c = el('article', 'card' + (done ? ' done' : ''));

    var top = el('div', 'top');
    top.appendChild(el('h3', 'title', req.title));
    top.appendChild(el('span', 'pill ' + (PILL[req.status] || 'submitted'), req.status || 'Submitted'));
    c.appendChild(top);

    var meta = el('div', 'meta');
    if (req.station) meta.appendChild(el('span', null, 'Station ' + req.station));
    var idSpan = el('span');
    idSpan.appendChild(document.createTextNode('Request '));
    idSpan.appendChild(el('code', null, req.request_id));
    meta.appendChild(idSpan);
    c.appendChild(meta);

    c.appendChild(pipeline(req));

    var dates = el('dl', 'dates');
    dates.appendChild(dateBlock('Required by', req.required_by, !done && req.required_by && req.required_by < today));
    dates.appendChild(dateBlock('Scheduled', req.scheduled_date, false));
    dates.appendChild(dateBlock('Delivered', req.delivered_date, false));
    c.appendChild(dates);

    var acts = el('div', 'acts');
    if (req.deliverable_link) {
      var a = el('a', 'btn primary');
      a.href = req.deliverable_link;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.appendChild(icon('M6.5 3H3.5A1.5 1.5 0 0 0 2 4.5v8A1.5 1.5 0 0 0 3.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-3M9.5 2h4.5v4.5M13.5 2.5 7 9'));
      a.appendChild(el('span', null, 'Open deliverable in ACC'));
      acts.appendChild(a);
    }
    if (CHANGE_FORM_URL.indexOf('http') === 0) {
      var b = el('a', 'btn ghost');
      b.href = CHANGE_FORM_URL + (CHANGE_FORM_URL.indexOf('?') === -1 ? '?' : '&') +
               'rid=' + encodeURIComponent(req.request_id);
      b.target = '_blank';
      b.rel = 'noopener noreferrer';
      b.appendChild(icon('M11.5 2.5a1.77 1.77 0 0 1 2.5 2.5L6 13l-3.5 1 1-3.5zM10 4l2 2'));
      b.appendChild(el('span', null, 'Request a change'));
      acts.appendChild(b);
    }
    if (acts.children.length) c.appendChild(acts);

    return c;
  }

  function sectionOf(heading, count, requests, today) {
    var s = el('section');
    var h = el('div', 'shead');
    h.appendChild(el('h2', null, heading));
    h.appendChild(el('span', 'c', String(count)));
    s.appendChild(h);
    requests.forEach(function (r) { s.appendChild(card(r, today)); });
    return s;
  }

  function tally(kind, n, label) {
    var t = el('div', 'tally' + (kind ? ' ' + kind : ''));
    t.appendChild(el('div', 'n', String(n)));
    t.appendChild(el('div', 'k', label));
    return t;
  }

  // ---------- render ----------

  function render(data) {
    var today = todayISO();
    var all = Array.isArray(data.requests) ? data.requests : [];
    var open = all.filter(function (r) { return r.status !== 'Delivered' && r.status !== 'Closed'; });
    var done = all.filter(function (r) { return r.status === 'Delivered' || r.status === 'Closed'; });
    var live = open.filter(function (r) { return r.status === 'In progress' || r.status === 'Scheduled'; });

    document.title = data.company + ' survey requests | Geosurv';

    stamp.replaceChildren();
    stamp.appendChild(el('b', null, 'Updated ' + fmtStamp(data.generated_at)));
    stamp.appendChild(document.createTextNode('Updated every 15 minutes'));

    main.replaceChildren();

    var intro = el('div', 'intro');
    intro.appendChild(el('p', 'eyebrow', 'Survey request tracker'));
    intro.appendChild(el('h1', null, data.company));
    intro.appendChild(el('p', 'sub',
      all.length === 1 ? '1 request with Geosurv.' : all.length + ' requests with Geosurv.'));

    var tallies = el('div', 'tallies');
    tallies.appendChild(tally('', open.length, open.length === 1 ? 'Open' : 'Open'));
    tallies.appendChild(tally('is-live', live.length, 'Scheduled or on site'));
    tallies.appendChild(tally('is-done', done.length, 'Delivered'));
    intro.appendChild(tallies);
    main.appendChild(intro);

    if (!all.length) {
      var box = el('div', 'state ok');
      box.appendChild(el('div', 'mark', '✓'));
      box.appendChild(el('h2', null, 'No requests yet'));
      box.appendChild(el('p', null,
        'Once a survey request is submitted it will appear here, and this page will keep itself up to date.'));
      main.appendChild(box);
    }

    if (open.length) main.appendChild(sectionOf('Open requests', open.length, open, today));
    if (done.length) main.appendChild(sectionOf('Delivered', done.length, done, today));
  }

  // ---------- boot ----------

  var token = new URLSearchParams(location.search).get('c');

  if (!token) {
    state('', '?', 'This page needs your access link',
      'Open the tracker from the link in your Geosurv status email. If you do not have it, ask your Geosurv coordinator to resend it.');
    return;
  }

  if (!/^[a-f0-9]{32}$/.test(token)) {
    state('', '!', 'This link is not recognised',
      'The access link looks incomplete. Copy the full link from your Geosurv status email, or ask your coordinator to resend it.');
    return;
  }

  fetch('data/' + token + '.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function (res) {
      if (!res.ok) throw new Error('not found');
      return res.json();
    })
    .then(render)
    .catch(function () {
      state('', '!', 'This link is not recognised',
        'We could not find a tracker for this link. Copy the full link from your Geosurv status email, or ask your Geosurv coordinator to resend it.');
    });
})();
</script>
</body>
</html>
