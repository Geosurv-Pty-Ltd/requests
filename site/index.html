<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<title>Survey requests | Geosurv</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23E8402F'/><path d='M9 20.5 15 11l3.4 5.4L20.6 13 24 20.5z' fill='%23fff'/></svg>">
<style>
  :root {
    --red: #F05540;
    --red-tint: rgba(240, 85, 64, .14);

    --bg: #0F1116;
    --panel: #161922;
    --row: #161922;
    --row-alt: #1B1F2A;
    --row-hover: #212636;

    --ink: #E8EBF2;
    --muted: #98A1B3;
    --faint: #6B7488;
    --line: #262B38;
    --line-soft: #1F2431;

    --radius: 10px;

    /* monday status colours, so the board and the tracker read the same */
    --s-submitted: #6B7488;
    --s-review:    #C77A18;
    --s-scheduled: #3B7BD8;
    --s-progress:  #8446C6;
    --s-delivered: #12A150;
    --s-closed:    #3A4152;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 400 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 1320px; margin: 0 auto; padding: 0 20px; }

  /* ---------- header ---------- */

  header { background: var(--panel); border-bottom: 1px solid var(--line); }
  .bar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; min-height: 60px; padding: 11px 0;
  }
  /* The logo artwork is dark navy on transparent, so it needs a light chip
     behind it to stay legible on a dark page. */
  .logomark {
    background: #fff; border-radius: 7px; padding: 6px 10px;
    display: inline-flex; align-items: center;
  }
  .logo { height: 22px; width: auto; display: block; }
  .stamp { text-align: right; font-size: 12px; line-height: 1.35; color: var(--faint); white-space: nowrap; }
  .stamp b { display: block; color: var(--muted); font-weight: 500; }

  /* ---------- title ---------- */

  .intro { padding: 26px 0 4px; }
  .eyebrow {
    font-size: 11.5px; font-weight: 600; letter-spacing: .07em;
    text-transform: uppercase; color: var(--red); margin: 0 0 6px;
  }
  h1 { margin: 0; font-size: 24px; line-height: 1.2; font-weight: 650; letter-spacing: -.02em; }

  /* ---------- status filter pills ---------- */

  .filters { display: flex; flex-wrap: wrap; gap: 7px; margin: 18px 0 14px; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    font: inherit; font-size: 13px; font-weight: 500;
    padding: 6px 11px 6px 9px;
    border: 1px solid var(--line); border-radius: 999px;
    background: var(--panel); color: var(--muted);
    cursor: pointer; white-space: nowrap;
    transition: border-color .12s ease, color .12s ease, background .12s ease;
  }
  /* Must exclude the selected chip: this selector outranks the pressed rule
     below on specificity, and would repaint its label to the wrong colour. */
  .chip:hover:not([aria-pressed="true"]) { border-color: #3A4152; color: var(--ink); background: var(--row-hover); }
  .chip .swatch { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
  .chip .n { font-variant-numeric: tabular-nums; font-weight: 620; color: var(--ink); }
  .chip[aria-pressed="true"] { border-color: var(--red); background: var(--red); color: #fff; }
  .chip[aria-pressed="true"] .n { color: #fff; }
  .chip:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

  /* ---------- table ---------- */

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .scroll { overflow-x: auto; }

  table { width: 100%; border-collapse: collapse; table-layout: fixed; }

  thead th {
    text-align: left;
    font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
    color: var(--faint);
    padding: 10px 14px;
    background: #12151D;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }

  /* One line per request. Anything too long is clipped with an ellipsis and
     carries the full text in a title attribute. */
  tbody td {
    padding: 0 14px;
    height: 44px;
    border-bottom: 1px solid var(--line-soft);
    font-size: 13.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  tbody tr:nth-child(even) td { background: var(--row-alt); }
  tbody tr:hover td { background: var(--row-hover); }
  tbody tr:last-child td { border-bottom: 0; }

  col.c-title  { width: auto; }
  col.c-desc   { width: 22%; }
  col.c-by     { width: 158px; }
  col.c-status { width: 122px; }
  col.c-stn    { width: 70px; }
  col.c-date   { width: 108px; }
  col.c-id     { width: 98px; }
  col.c-act    { width: 142px; }

  /* The pill is a fixed size block, so clipping it to the cell would cut the
     label. Nothing else can overflow this cell. */
  td.c-status { overflow: visible; text-overflow: clip; }

  .t { font-weight: 550; color: var(--ink); }
  .desc, .by { color: var(--muted); }
  .by { font-size: 12.5px; }
  .rid { color: var(--faint); font-variant-numeric: tabular-nums; font-size: 12.5px; }

  .status {
    display: inline-block; min-width: 84px; text-align: center;
    padding: 4px 9px; border-radius: 5px;
    font-size: 12px; font-weight: 600; color: #fff; white-space: nowrap;
  }
  .st-Submitted    { background: var(--s-submitted); }
  .st-Underreview  { background: var(--s-review); }
  .st-Scheduled    { background: var(--s-scheduled); }
  .st-Inprogress   { background: var(--s-progress); }
  .st-Delivered    { background: var(--s-delivered); }
  .st-Closed       { background: var(--s-closed); }

  .station {
    display: inline-block; padding: 2px 8px; border-radius: 5px;
    background: #232838; color: var(--muted);
    font-size: 11.5px; font-weight: 600; letter-spacing: .02em;
  }

  .date { font-variant-numeric: tabular-nums; }
  .date.none { color: var(--faint); }
  .date.late { color: var(--red); font-weight: 600; }

  .c-act { text-align: right; }
  .link {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12.5px; font-weight: 550; text-decoration: none;
    padding: 4px 8px; border-radius: 6px; white-space: nowrap;
  }
  .link.acc { color: var(--red); }
  .link.acc:hover { background: var(--red-tint); }
  .link.chg { color: var(--faint); }
  .link.chg:hover { color: var(--ink); background: #262C3C; }
  .link svg { width: 12px; height: 12px; flex: 0 0 auto; }
  .link:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

  .empty { padding: 34px 16px; text-align: center; color: var(--muted); font-size: 14px; }

  /* ---------- states ---------- */

  .state {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 42px 26px; text-align: center; margin: 34px 0;
  }
  .state h2 { margin: 0 0 8px; font-size: 18px; font-weight: 620; letter-spacing: -.01em; }
  .state p { margin: 0 auto; max-width: 44ch; color: var(--muted); font-size: 14px; }
  .state .mark {
    width: 40px; height: 40px; border-radius: 11px;
    background: var(--red-tint); color: var(--red);
    display: grid; place-items: center; margin: 0 auto 16px;
    font-size: 19px; font-weight: 700;
  }
  .state.ok .mark { background: rgba(18, 161, 80, .16); color: #2FCB74; }

  footer {
    margin: 26px 0 0; padding: 20px 0 32px;
    border-top: 1px solid var(--line);
    color: var(--faint); font-size: 12px;
    display: flex; flex-wrap: wrap; gap: 4px 12px; justify-content: space-between;
  }

  /* ---------- mobile ----------
     A phone cannot show eight columns on one line, so below this width the
     table becomes one block per request. Blank dates are dropped entirely. */

  @media (max-width: 900px) {
    .wrap { padding: 0 14px; }
    h1 { font-size: 21px; }
    thead, colgroup { display: none; }
    table, tbody, tr, td { display: block; width: 100%; }
    table { table-layout: auto; }
    tbody tr { padding: 12px 14px; border-bottom: 1px solid var(--line-soft); }
    tbody tr:nth-child(even) td, tbody tr:hover td { background: transparent; }
    tbody tr:nth-child(even) { background: var(--row-alt); }
    tbody td { border: 0; padding: 0; height: auto; white-space: normal; }

    td.c-title { margin-bottom: 6px; }
    td.c-desc { margin-bottom: 8px; font-size: 13px; }
    td.c-status, td.c-stn { display: inline-block; width: auto; margin: 0 8px 8px 0; }

    td.k { display: flex; justify-content: space-between; gap: 12px; padding: 2px 0; font-size: 13px; }
    td.k::before { content: attr(data-label); color: var(--faint); font-size: 12px; }
    td.k.blank { display: none; }

    td.c-act { text-align: left; margin-top: 8px; }
    .link.acc, .link.chg { padding-left: 0; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <span class="logomark"><img class="logo" src="geosurv-logo.png" alt="Geosurv"></span>
    <div class="stamp" id="stamp"></div>
  </div>
</header>

<main class="wrap" id="main">
  <div class="state" id="loading">
    <div class="mark">&middot;&middot;&middot;</div>
    <h2>Loading your requests</h2>
    <p>One moment.</p>
  </div>
</main>

<footer class="wrap">
  <span>Geosurv survey request tracker</span>
  <span>Read only view. Contact your Geosurv coordinator for anything not shown here.</span>
</footer>

<script>
(function () {
  'use strict';

  // Public WorkForm used by the "Request a change" link. The Request ID is
  // passed as the "rid" URL parameter and pre-fills the matching question.
  var CHANGE_FORM_URL = 'https://forms.monday.com/forms/1da50b5af2a2517c7d2db49ad40289bd?r=apse2';

  // Board order, so the filter row reads like the monday Status column.
  var STATUSES = [
    { label: 'Submitted',    colour: 'var(--s-submitted)' },
    { label: 'Under review', colour: 'var(--s-review)' },
    { label: 'Scheduled',    colour: 'var(--s-scheduled)' },
    { label: 'In progress',  colour: 'var(--s-progress)' },
    { label: 'Delivered',    colour: 'var(--s-delivered)' },
    { label: 'Closed',       colour: 'var(--s-closed)' }
  ];

  var main = document.getElementById('main');
  var stamp = document.getElementById('stamp');

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function state(cls, mark, heading, body) {
    main.replaceChildren();
    var box = el('div', 'state' + (cls ? ' ' + cls : ''));
    box.appendChild(el('div', 'mark', mark));
    box.appendChild(el('h2', null, heading));
    box.appendChild(el('p', null, body));
    main.appendChild(box);
  }

  // ---------- dates ----------

  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  function fmtDate(iso) {
    if (!iso) return null;
    var p = String(iso).split('-');
    if (p.length !== 3) return null;
    var d = Number(p[2]), m = Number(p[1]), y = Number(p[0]);
    if (!d || !m || !y) return null;
    return d + ' ' + MONTHS[m - 1] + ' ' + y;
  }

  function todayISO() {
    // Sydney, so "overdue" matches the client's own calendar day.
    return new Intl.DateTimeFormat('en-CA', {
      timeZone: 'Australia/Sydney', year: 'numeric', month: '2-digit', day: '2-digit'
    }).format(new Date());
  }

  function fmtStamp(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return '';
    return new Intl.DateTimeFormat('en-AU', {
      timeZone: 'Australia/Sydney',
      day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit'
    }).format(d);
  }

  function icon(path) {
    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 16 16');
    svg.setAttribute('fill', 'none');
    svg.setAttribute('stroke', 'currentColor');
    svg.setAttribute('stroke-width', '1.7');
    svg.setAttribute('stroke-linecap', 'round');
    svg.setAttribute('stroke-linejoin', 'round');
    svg.setAttribute('aria-hidden', 'true');
    var p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', path);
    svg.appendChild(p);
    return svg;
  }

  // ---------- rows ----------

  function textCell(cls, label, value, extraClass) {
    var td = el('td', cls + (label ? ' k' : '') + (value ? '' : ' blank'));
    if (label) td.setAttribute('data-label', label);
    if (value) {
      td.title = value;
      td.appendChild(el('span', extraClass || null, value));
    } else {
      td.appendChild(el('span', 'date none', '—'));
    }
    return td;
  }

  function dateCell(label, iso, overdue) {
    var td = el('td', 'c-date k' + (iso ? '' : ' blank'));
    td.setAttribute('data-label', label);
    var v = fmtDate(iso);
    td.appendChild(el('span', 'date' + (v ? (overdue ? ' late' : '') : ' none'), v || '—'));
    return td;
  }

  function row(req, today, showDesc) {
    var tr = el('tr');
    tr.setAttribute('data-status', req.status || 'Submitted');

    var title = el('td', 'c-title');
    title.title = req.title;
    title.appendChild(el('span', 't', req.title));
    tr.appendChild(title);

    if (showDesc) tr.appendChild(textCell('c-desc', 'Details', req.description, 'desc'));

    tr.appendChild(textCell('c-by', 'Requested by', req.requested_by, 'by'));

    var st = el('td', 'c-status');
    var label = req.status || 'Submitted';
    st.appendChild(el('span', 'status st-' + label.replace(/\s+/g, ''), label));
    tr.appendChild(st);

    var stn = el('td', 'c-stn k' + (req.station ? '' : ' blank'));
    stn.setAttribute('data-label', 'Station');
    if (req.station) stn.appendChild(el('span', 'station', req.station));
    tr.appendChild(stn);

    var done = label === 'Delivered' || label === 'Closed';
    tr.appendChild(dateCell('Required by', req.required_by, !done && req.required_by && req.required_by < today));
    tr.appendChild(dateCell('Scheduled', req.scheduled_date, false));
    tr.appendChild(dateCell('Delivered', req.delivered_date, false));

    var id = el('td', 'c-id k');
    id.setAttribute('data-label', 'Request');
    id.appendChild(el('span', 'rid', req.request_id));
    tr.appendChild(id);

    var act = el('td', 'c-act');
    if (req.deliverable_link) {
      var a = el('a', 'link acc');
      a.href = req.deliverable_link;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.appendChild(icon('M6.5 3H3.5A1.5 1.5 0 0 0 2 4.5v8A1.5 1.5 0 0 0 3.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-3M9.5 2h4.5v4.5M13.5 2.5 7 9'));
      a.appendChild(el('span', null, 'ACC'));
      act.appendChild(a);
    }
    var b = el('a', 'link chg');
    b.href = CHANGE_FORM_URL + '&rid=' + encodeURIComponent(req.request_id);
    b.target = '_blank';
    b.rel = 'noopener noreferrer';
    b.title = 'Request a change to this request';
    b.appendChild(icon('M11.5 2.5a1.77 1.77 0 0 1 2.5 2.5L6 13l-3.5 1 1-3.5zM10 4l2 2'));
    b.appendChild(el('span', null, 'Change'));
    act.appendChild(b);
    tr.appendChild(act);

    return tr;
  }

  function chip(label, colour, count, onPick) {
    var b = el('button', 'chip');
    b.type = 'button';
    b.setAttribute('aria-pressed', 'false');
    if (colour) {
      var sw = el('span', 'swatch');
      sw.style.background = colour;
      b.appendChild(sw);
    }
    b.appendChild(el('span', null, label));
    b.appendChild(el('span', 'n', String(count)));
    b.addEventListener('click', function () { onPick(b); });
    return b;
  }

  // ---------- render ----------

  function render(data) {
    var today = todayISO();
    var all = Array.isArray(data.requests) ? data.requests : [];
    var showDesc = all.some(function (r) { return r.description; });

    document.title = data.company + ' survey requests | Geosurv';

    stamp.replaceChildren();
    stamp.appendChild(el('b', null, 'Updated ' + fmtStamp(data.generated_at)));
    // Deliberately no interval promise. GitHub honours roughly one scheduled
    // slot in six, measured at a 93 minute average against a 15 minute cron,
    // so any stated interval would be untrue on a bad stretch. The real
    // snapshot time above carries the information instead.
    stamp.appendChild(document.createTextNode('Updated automatically'));

    main.replaceChildren();

    var intro = el('div', 'intro');
    intro.appendChild(el('p', 'eyebrow', 'Survey request tracker'));
    intro.appendChild(el('h1', null, data.company));
    main.appendChild(intro);

    if (!all.length) {
      var box = el('div', 'state ok');
      box.appendChild(el('div', 'mark', '✓'));
      box.appendChild(el('h2', null, 'No requests yet'));
      box.appendChild(el('p', null,
        'Once a survey request is submitted it will appear here, and this page will keep itself up to date.'));
      main.appendChild(box);
      return;
    }

    var panel = el('div', 'panel');
    var scroll = el('div', 'scroll');
    var table = el('table');

    var cols = el('colgroup');
    var colDefs = ['c-title'];
    if (showDesc) colDefs.push('c-desc');
    colDefs = colDefs.concat(['c-by', 'c-status', 'c-stn', 'c-date', 'c-date', 'c-date', 'c-id', 'c-act']);
    colDefs.forEach(function (c) { cols.appendChild(el('col', c)); });
    table.appendChild(cols);

    var heads = ['Request'];
    if (showDesc) heads.push('Details');
    heads = heads.concat(['Requested by', 'Status', 'Station', 'Required by', 'Scheduled', 'Delivered', 'Request ID', '']);

    var thead = el('thead');
    var htr = el('tr');
    heads.forEach(function (h) { htr.appendChild(el('th', null, h)); });
    thead.appendChild(htr);
    table.appendChild(thead);

    var tbody = el('tbody');
    all.forEach(function (r) { tbody.appendChild(row(r, today, showDesc)); });
    table.appendChild(tbody);
    scroll.appendChild(table);
    panel.appendChild(scroll);

    var empty = el('div', 'empty', 'No requests with that status.');
    empty.hidden = true;
    panel.appendChild(empty);

    var chips = el('div', 'filters');
    var buttons = [];

    function apply(active, wanted) {
      buttons.forEach(function (b) { b.setAttribute('aria-pressed', String(b === active)); });
      var shown = 0;
      Array.prototype.forEach.call(tbody.children, function (tr) {
        var match = !wanted || tr.getAttribute('data-status') === wanted;
        tr.hidden = !match;
        if (match) shown += 1;
      });
      empty.hidden = shown > 0;
      scroll.hidden = shown === 0;
      // Zebra follows what is on screen, not the underlying row order.
      var i = 0;
      Array.prototype.forEach.call(tbody.children, function (tr) {
        if (tr.hidden) return;
        i += 1;
        tr.style.background = '';
        Array.prototype.forEach.call(tr.children, function (td) {
          td.style.background = i % 2 === 0 ? 'var(--row-alt)' : '';
        });
      });
    }

    var allChip = chip('All', null, all.length, function (b) { apply(b, null); });
    buttons.push(allChip);
    chips.appendChild(allChip);

    STATUSES.forEach(function (s) {
      var n = all.filter(function (r) { return (r.status || 'Submitted') === s.label; }).length;
      // A stage nobody is at is noise, so it is left out entirely.
      if (!n) return;
      var b = chip(s.label, s.colour, n, function (btn) { apply(btn, s.label); });
      buttons.push(b);
      chips.appendChild(b);
    });

    main.appendChild(chips);
    main.appendChild(panel);
    apply(allChip, null);
  }

  // ---------- boot ----------

  var token = new URLSearchParams(location.search).get('c');

  if (!token) {
    state('', '?', 'This page needs your access link',
      'Open the tracker from the link in your Geosurv status email. If you do not have it, ask your Geosurv coordinator to resend it.');
    return;
  }

  if (!/^[a-f0-9]{32}$/.test(token)) {
    state('', '!', 'This link is not recognised',
      'The access link looks incomplete. Copy the full link from your Geosurv status email, or ask your coordinator to resend it.');
    return;
  }

  fetch('data/' + token + '.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function (res) {
      if (!res.ok) throw new Error('not found');
      return res.json();
    })
    .then(render)
    .catch(function () {
      state('', '!', 'This link is not recognised',
        'We could not find a tracker for this link. Copy the full link from your Geosurv status email, or ask your Geosurv coordinator to resend it.');
    });
})();
</script>
</body>
</html>
